<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mihai Cosma — Status</title>
    <style>
        @font-face {
            font-family: "D2Coding";
            src: url("/D2CodingLigature.ttf") format("truetype");
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #040506;
            color: #b6aa99;
            font-family: "D2Coding";
            font-size: 0.875rem;
            line-height: 1.5;
            padding: 8px;
        }

        .dim { color: #7a6e5e; }
        .ok { color: #6b8f5e; }
        .warn { color: #c4862c; }
        .over { color: #b84a3a; }

        .titlebar {
            background: #0a0908;
            border: 1px solid #3d3428;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .titlebar a {
            color: #7a6e5e;
            text-decoration: none;
        }
        .titlebar a:hover { color: #b6aa99; }

        .layout {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .panel {
            background: #0a0908;
            border: 1px solid #3d3428;
            padding: 0;
        }

        .panel-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #7a6e5e;
            padding: 6px 12px;
            border-bottom: 1px solid #3d3428;
            display: flex;
            justify-content: space-between;
        }

        .panel-body { padding: 10px 12px; }

        .status-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 6px;
        }

        .status-row:last-child { margin-bottom: 0; }

        .meter-row {
            margin-bottom: 10px;
        }

        .meter-row:last-child { margin-bottom: 0; }

        .meter-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 4px;
        }

        .meter-label { color: #b6aa99; }
        .meter-info { color: #7a6e5e; font-size: 0.75rem; }

        .meter-bar {
            width: 100%;
            height: 8px;
            background: #060504;
            border: 1px solid #3d3428;
            overflow: hidden;
            margin-bottom: 2px;
        }

        .meter-fill { height: 100%; }
        .meter-fill.ok { background: #6b8f5e; }
        .meter-fill.warn { background: #c4862c; }
        .meter-fill.over { background: #b84a3a; }

        .meter-footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #7a6e5e;
        }

        .meter-pace { font-size: 0.75rem; }

        .footer-row {
            font-size: 0.7rem;
            color: #7a6e5e;
            margin-top: 8px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .footer-cell {
            display: flex;
            justify-content: space-between;
        }
        .footer-row a {
            color: #7a6e5e;
            text-decoration: none;
        }
        .footer-row a:hover { color: #b6aa99; }
        .footer-row .right { text-align: right; }

        @media (max-width: 760px) {
            .layout { grid-template-columns: 1fr; }
            .footer-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="titlebar">
        <span>status — mihai cosma</span>
        <a href="/">← home</a>
    </div>

    <div class="layout">
        <div class="panel" id="claude-panel">
            <div class="panel-title">
                <span>Claude</span>
                <span id="claude-plan" class="dim">—</span>
            </div>
            <div class="panel-body" id="claude-body">
                <span class="dim">loading...</span>
            </div>
        </div>

        <div class="panel" id="codex-panel">
            <div class="panel-title">
                <span>Codex</span>
                <span id="codex-plan" class="dim">—</span>
            </div>
            <div class="panel-body" id="codex-body">
                <span class="dim">no data</span>
            </div>
        </div>

        <div class="panel" id="agy-panel">
            <div class="panel-title">
                <span>Agy</span>
                <span id="agy-plan" class="dim">—</span>
            </div>
            <div class="panel-body" id="agy-body">
                <span class="dim">no data</span>
            </div>
        </div>
    </div>

    <div class="footer-row">
        <span class="footer-cell"><a href="https://github.com/wakamex/ccusage">ccusage</a><span id="claude-updated"></span></span>
        <span class="footer-cell"><a href="https://github.com/wakamex/codex-cli-usage">codex-cli-usage</a><span id="codex-updated"></span></span>
        <span class="footer-cell"><a href="https://github.com/wakamex/agy-usage">agy-usage</a><span id="agy-updated"></span></span>
    </div>

    <script>
    (function() {
        function multClass(m) {
            if (m < 0.8) return 'ok';
            if (m <= 1.0) return 'warn';
            return 'over';
        }

        function calcMult(pct, resetsAt, periodHours) {
            if (!resetsAt || !pct) return null;
            var remaining = (new Date(resetsAt) - new Date()) / 3600000;
            if (remaining <= 0) return null;
            var timeLeft = (remaining / periodHours) * 100;
            var budgetLeft = 100 - pct;
            if (budgetLeft <= 0) return Infinity;
            return timeLeft / budgetLeft;
        }

        function fmtReset(iso) {
            if (!iso) return '';
            var secs = (new Date(iso) - new Date()) / 1000;
            if (secs <= 0) return 'now';
            var h = Math.floor(secs / 3600);
            if (h >= 24) return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
            var m = Math.floor((secs % 3600) / 60);
            return h + 'h ' + m + 'm';
        }

        function fmtAge(iso) {
            if (!iso) return '';
            var secs = (new Date() - new Date(iso)) / 1000;
            if (secs < 60) return 'just now';
            var m = Math.floor(secs / 60);
            if (m < 60) return m + 'm ago';
            var h = Math.floor(m / 60);
            return h + 'h ' + (m % 60) + 'm ago';
        }

        function meterRow(label, pct, mult, resetsAt, periodHours) {
            var cls = mult !== null ? multClass(mult) : 'ok';
            var fillW = Math.min(pct, 100);
            var multStr = mult === null ? '' : (mult >= 10 ? '>10x' : mult.toFixed(2) + 'x');
            var reset = fmtReset(resetsAt);
            return '<div class="meter-row">' +
                '<div class="meter-header">' +
                    '<span class="meter-label">' + label + '</span>' +
                    '<span class="meter-pace ' + cls + '">' + (multStr ? 'Burn: ' + multStr : '') + '</span>' +
                '</div>' +
                '<div class="meter-bar"><div class="meter-fill ' + cls + '" style="width:' + fillW + '%"></div></div>' +
                '<div class="meter-footer">' +
                    '<span>' + Math.round(pct) + '% used</span>' +
                    (reset ? '<span>resets ' + reset + '</span>' : '') +
                '</div>' +
                '</div>';
        }

        function agyPeriodHours(bucket) {
            var win = String(bucket.window || '').toLowerCase();
            var name = String(bucket.display_name || '').toLowerCase();
            if (win === '5h' || name.indexOf('five hour') >= 0) return 5;
            if (win === 'weekly' || win === '1w' || win === '7d' || name.indexOf('weekly') >= 0) return 168;
            return null;
        }

        function agyLabel(group, bucket) {
            var groupName = String(group.display_name || '').replace(/ models$/i, '');
            var bucketName = String(bucket.display_name || 'Quota');
            if (!groupName || groupName.toLowerCase() === 'quota') return bucketName;
            return groupName + ' · ' + bucketName;
        }

        fetch('/usage.json').then(function(r) { return r.json(); }).then(function(d) {
            if (d.claude) {
                var c = d.claude;
                document.getElementById('claude-plan').textContent = c.plan || '—';

                var html = '';
                if (c['5h']) {
                    var m = calcMult(c['5h'].pct, c['5h'].resets_at, 5);
                    html += meterRow('Session (5h)', c['5h'].pct, m, c['5h'].resets_at, 5);
                }
                // Render the weekly bucket plus any per-model variant (7d_fable, 7d_opus, ...) dynamically.
                Object.keys(c).filter(function(k) {
                    return k === '7d' || k.indexOf('7d_') === 0;
                }).sort(function(a, b) {
                    return a.length - b.length || (a < b ? -1 : 1);
                }).forEach(function(k) {
                    var b = c[k];
                    if (!b || b.pct === null || b.pct === undefined) return;
                    var model = k.slice(3);
                    var label = model ? 'Week (' + model.charAt(0).toUpperCase() + model.slice(1) + ')' : 'Week (all models)';
                    var m = calcMult(b.pct, b.resets_at, 168);
                    html += meterRow(label, b.pct, m, b.resets_at, 168);
                });
                if (c.extra_usage && c.extra_usage.is_enabled) {
                    var used = c.extra_usage.used_credits || 0;
                    var limit = c.extra_usage.monthly_limit || 1;
                    var pct = (used / limit) * 100;
                    html += '<div class="status-row"><span class="dim">Extra usage</span><span>$' +
                        (used / 100).toFixed(2) + ' / $' + (limit / 100).toFixed(2) + '</span></div>';
                }
                document.getElementById('claude-body').innerHTML = html || '<span class="dim">no buckets</span>';
                document.getElementById('claude-updated').textContent = 'updated ' + fmtAge(c.updated_at);
            }

            if (d.codex) {
                var x = d.codex;
                document.getElementById('codex-plan').textContent = x.plan || '—';
                var html = '';
                if (x['5h']) {
                    var m = calcMult(x['5h'].pct, x['5h'].resets_at, 5);
                    html += meterRow('Session (5h)', x['5h'].pct, m, x['5h'].resets_at, 5);
                }
                if (x['7d']) {
                    var m = calcMult(x['7d'].pct, x['7d'].resets_at, 168);
                    html += meterRow('Week (all models)', x['7d'].pct, m, x['7d'].resets_at, 168);
                }
                if (x.additional) {
                    x.additional.forEach(function(a) {
                        if (a.primary) {
                            var m = calcMult(a.primary.pct, a.primary.resets_at, 5);
                            html += meterRow(a.name + ' (5h)', a.primary.pct, m, a.primary.resets_at, 5);
                        }
                        if (a.secondary) {
                            var m = calcMult(a.secondary.pct, a.secondary.resets_at, 168);
                            html += meterRow(a.name + ' (7d)', a.secondary.pct, m, a.secondary.resets_at, 168);
                        }
                    });
                }
                document.getElementById('codex-body').innerHTML = html || '<span class="dim">no data</span>';
                document.getElementById('codex-updated').textContent = 'updated ' + fmtAge(x.updated_at);
            }

            if (d.agy) {
                var a = d.agy;
                document.getElementById('agy-plan').textContent = a.plan || '—';
                var html = '';
                if (a.quota_summary && a.quota_summary.groups) {
                    a.quota_summary.groups.forEach(function(group) {
                        (group.buckets || []).forEach(function(bucket) {
                            if (bucket.disabled || bucket.remaining_pct === null || bucket.remaining_pct === undefined) return;
                            var pct = Math.max(0, 100 - bucket.remaining_pct);
                            var periodHours = agyPeriodHours(bucket);
                            var m = periodHours ? calcMult(pct, bucket.reset_time, periodHours) : null;
                            html += meterRow(agyLabel(group, bucket), pct, m, bucket.reset_time, periodHours);
                        });
                    });
                } else if (a.quota_summary_error) {
                    html = '<span class="dim">' + a.quota_summary_error + '</span>';
                }
                document.getElementById('agy-body').innerHTML = html || '<span class="dim">no quota</span>';
                document.getElementById('agy-updated').textContent = 'updated ' + fmtAge(a.updated_at);
            }
        }).catch(function() {
            document.getElementById('claude-body').innerHTML = '<span class="dim">offline</span>';
            document.getElementById('codex-body').innerHTML = '<span class="dim">offline</span>';
            document.getElementById('agy-body').innerHTML = '<span class="dim">offline</span>';
        });
    })();
    </script>
</body>
</html>
